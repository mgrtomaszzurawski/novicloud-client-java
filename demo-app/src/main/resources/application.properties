# NoviCloud API Basic auth
novicloud.account-name=${NOVICLOUD_ACCOUNT_NAME:}
novicloud.password=${NOVICLOUD_PASSWORD:}
# Base URL override for local mock server (leave empty for production)
# Example: novicloud.base-url=http://localhost:4010
novicloud.base-url=${NOVICLOUD_BASE_URL:}

# Demo run mode: READ_ONLY (default), CRUD_SAFE, CREATE_SOFT, CRUD_ALL
# See DESIGN-demo-mode-toggle.md for details.
demo.mode=READ_ONLY
